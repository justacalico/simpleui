name: simpleui
description: "A simple ComfyUI client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  http: ^1.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/icon_256.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#6C5CE7"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#6C5CE7"
    theme_color: "#6C5CE7"
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/icon.png
